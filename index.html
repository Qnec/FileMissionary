<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Hello World!</title>
	</head>
	<body>
		<div class="interface-container">
			<div class="sidebar-container">
				<div class="titlecard">
					<div class="logo">
						<div>
							<p>FM</p>
						</div>
					</div>
					<div class="title">
						<p>File Missionary</p>
					</div>
				</div>
				<div class="navigation-menu">
					<span>
						<input name="navigation-selector" type="radio" id="dashboard-selector" checked="checked">
						<label name="navigation-selector" for="dashboard-selector">
							Dashboard
						</label>
					</span>
					<span>
						<input name="navigation-selector" type="radio" id="downloader-selector">
						<label name="navigation-selector" for="downloader-selector">
							Downloader
						</label>
					</span>
					<span>
						<input name="navigation-selector" type="radio" id="image-selector">
						<label name="navigation-selector" for="image-selector">
							Image tools
						</label>
					</span>
					<span>
						<input name="navigation-selector" type="radio" id="media-selector">
						<label name="navigation-selector" for="media-selector">
							Media converter
						</label>
					</span>
					<span>
						<input name="navigation-selector" type="radio" id="queue-selector">
						<label name="navigation-selector" for="queue-selector">
							Queue
						</label>
					</span>
					<span>
						<input name="navigation-selector" type="radio" id="settings-selector">
						<label name="navigation-selector" for="settings-selector">
							Settings
						</label>
					</span>
				</div>
			</div>
			<div class="navigation-option" id="dashboard">
				dashboard
			</div>
			<div class="navigation-option" id="downloader">
				<h1>yt-dlp Media Extractor</h1>
				<div class="downloader-url-input-container">
					<span> <!-- future proofing for a link icon here -->
						<input type="text" placeholder="https://...">
					</span>
					<button class="button-configuration">Fetch Info</button>
				</div>
				<div class="configuration-container">
					<p>Format Settings</p>
					<div class="configuration-section">
						<p>Video Resolution Selector</p>
						<div class="radio-configuration">
							<span>
								<input name="downloader-url-selector" type="radio" id="best-selector" checked="checked">
								<label name="downloader-url-selector" for="best-selector">
									Best
								</label>
							</span>
							<span>
								<input name="downloader-url-selector" type="radio" id="4k-selector">
								<label name="downloader-url-selector" for="4k-selector">
									4K
								</label>
							</span>
							<span>
								<input name="downloader-url-selector" type="radio" id="1080p-selector">
								<label name="downloader-url-selector" for="1080p-selector">
									1080p
								</label>
							</span>
							<span>
								<input name="downloader-url-selector" type="radio" id="720p-selector">
								<label name="downloader-url-selector" for="720p-selector">
									720p
								</label>
							</span>
							<span>
								<input name="downloader-url-selector" type="radio" id="audio-selector">
								<label name="downloader-url-selector" for="audio-selector">
									Audio Only
								</label>
							</span>
						</div>
					</div>
					<div class="configuration-section">
						<p>Segment</p>
						<div class="double-sided-slider-configuration">
							
						</div>
					</div>
				</div>
				<div class="information-container">
					
				</div>
			</div>
			<div class="navigation-option" id="image">
				<p>Choose a file</p> <!-- For some godforsaken reason electron broke input type=file years ago and just never fixed it and told everyone to replicate the functionality with javascript -->
				<button class="file-button">wee</button>
			</div>
			<div class="navigation-option" id="media">
				media
			</div>
			<div class="navigation-option" id="queue">
				queue
			</div>
			<div class="navigation-option" id="settings">
				settings
			</div>
		</div>
		<script type="module" src="/src/renderer.ts"></script>
	</body>
</html>
